version: '3.8'

services:
  # Backend service
  backend:
    build:
      context: ./api  # Point to api directory
      dockerfile: Dockerfile

#    env_file:
#      - .env
    ports:
      - "12345:12345"
    environment:
      NODE_ENV: development
      DB_HOST: 172.18.0.2
      DB_PORT: 5432
      DB_USERNAME: your_database_username
      DB_PASSWORD: your_database_password
      DB_DATABASE: jira_development
      JWT_SECRET: development12345
    volumes:
#      - ./api:/app
      - /app/node_modules

    depends_on:
      - database
#    restart: unless-stopped



  # Frontend service
  frontend:
    build:
      context: ./client  # Point to api directory
      dockerfile: Dockerfile
    ports:
      - "80:8080"
    depends_on:
      - backend
    restart: unless-stopped



  # Database (example with PostgreSQL)
  database:
    image: postgres:13
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: jira_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@jira.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - database



volumes:
  postgres_data:
  pgadmin_data:
